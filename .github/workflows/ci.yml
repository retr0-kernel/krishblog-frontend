name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: https://krishblog-production.up.railway.app
  NEXT_PUBLIC_SITE_URL: https://krishblog-frontend.vercel.app
  NEXT_PUBLIC_SITE_NAME: Krish Blog
  NEXT_PUBLIC_IMAGES_REPO_URL: https://github.com/retr0-kernel/krishblog-images
  NEXT_PUBLIC_IMAGES_REPO_RAW_BASE: https://raw.githubusercontent.com/retr0-kernel/krishblog-images/main/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
